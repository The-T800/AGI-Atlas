name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint and test
        run: |
          uv run python scripts/check_public_metadata.py
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Generated files are up to date
        run: |
          uv run python scripts/build_openalex.py
          uv run python scripts/build_catalog.py
          uv run python scripts/import_public_scores.py
          uv run python scripts/build_models.py
          uv run agi-atlas validate
          uv run agi-atlas report
          uv run agi-atlas site
          git diff --exit-code -- data/ reports/ docs/
