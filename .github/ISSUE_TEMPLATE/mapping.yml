name: Mapping issue / 映射问题
description: A benchmark is mapped to the wrong job activity or discipline, or a mapping is missing. / 基准映射错误或缺失。
labels: [mapping]
body:
  - type: input
    id: benchmark
    attributes:
      label: Benchmark / 基准
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: O*NET activity ID or OpenAlex subject ID / 工作活动 ID 或 OpenAlex 主题 ID
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Change / 修改
      options: [add direct, add partial, change to partial, remove]
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why / 理由
    validations:
      required: true
